# Written by basstler's /setup-personal-notes; re-run it to update this file rather than
# editing it here.
name: Plan site merge dispatch

# Every pull request opened, reopened, marked ready, turned back into a draft, merged or
# closed, a fork's included, starts the plan site's build in tomsch420/plans, so the
# site shows its state without waiting for the next push to the notes branch. It runs on
# pull_request_target to read the token for a fork's pull request too; it checks out
# nothing and reads nothing the pull request controls.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, converted_to_draft, closed]

permissions: {}

concurrency:
  group: plan-site-merge
  cancel-in-progress: true

jobs:
  dispatch:
    name: Start the plan site build
    if: github.repository == 'tomsch420/law_as_code_benchmarks'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start the build
        env:
          GH_TOKEN: ${{ secrets.PLAN_SITE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error title=PLAN_SITE_TOKEN is not stored::tomsch420/law_as_code_benchmarks stores no PLAN_SITE_TOKEN secret, so this run started no build in tomsch420/plans. Run /setup-personal-notes, or create the token at https://github.com/settings/personal-access-tokens/new?name=basstler+plan+site&description=Starts+the+plan+site+build+in+tomsch420%2Fplans&target_name=tomsch420&actions=write and store it at https://github.com/tomsch420/law_as_code_benchmarks/settings/secrets/actions/new"
            exit 1
          fi
          gh workflow run plan-site.yml --repo tomsch420/plans
