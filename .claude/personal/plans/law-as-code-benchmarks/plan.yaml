  branch: krrood-sara-remaining-sections
  track: krrood-benchmarks
  depends_on: []
  status: not started
  notes: 'Model the rest of section 3306 (employer, wages and employment, its exclusions
    included) and the employment tax of section 3301, scored on their 8 test-split cases
