schema_version: 1
id: law-as-code-benchmarks
title: krrood on law-as-code benchmarks
description: >
  Models the benchmarks the survey (doc/law_as_code_benchmarks.md) picked in krrood, scores each
  against its reference answers, and reports what krrood handles, works around or lacks.
default_repository: tomsch420/law_as_code_benchmarks
tracking_issue: 2
waves:
  - id: benchmarks
    name: Law-as-code benchmarks
tracks:
  - id: krrood-benchmarks
    name: krrood on law-as-code benchmarks
    wave: benchmarks
items:
  - id: krrood-sara
    title: Load SARA's cases and model the exclusions from employment of section 3306(c)
    branch: krrood-sara
    track: krrood-benchmarks
    pull_request_number: 4
    session: local Claude Code session 9ddb84d5-82e1-41d7-868c-f2696b0634c5
    depends_on: []
    status: in progress
    notes: >
      Commit SARA's files, load each case from its Prolog facts (SWI-Prolog expands the facts
      its rules generate; krrood decides every answer) and score cases against their test
      goals. Model the exclusions from employment of section 3306(c) in krrood: (6), (7),
      (10)(B), (11), (16), (B) and (1)(B), scored on their 14 test-split cases.

  - id: krrood-catala-family-benefits
    title: Model Catala's French family benefits in krrood and score them
    branch: krrood-catala-family-benefits
    track: krrood-benchmarks
    depends_on: []
    status: not started
    notes: >
      Model allocations_familiales (with prestations_familiales and
      base_mensuelle_allocations_familiales) from catala-examples in krrood, defaults and their
      exceptions as rules, amounts chosen by date; score the share of its 15 tests reproduced.
  - id: krrood-openfisca-family-benefits
    title: Score the family benefits model on OpenFisca France's tests
    branch: krrood-openfisca-family-benefits
    track: krrood-benchmarks
    depends_on: [krrood-catala-family-benefits]
    status: not started
    notes: >
      Run the family benefits model on OpenFisca France's 93 tests/formulas/af*.yaml tests
      (2006-2026), fetched by a script. Score the share within each test's error margin, the
      values OpenFisca computed itself scored apart.
  - id: krrood-law-as-code-report
    title: Report what krrood handles, works around or lacks on law as code
    branch: krrood-law-as-code-report
    track: krrood-benchmarks
    depends_on: [krrood-sara-remaining-sections, krrood-catala-family-benefits, krrood-openfisca-family-benefits]
    status: not started
    notes: >
      Across the three benchmarks, what krrood states directly, what needed a workaround and
      what it lacks, with each gap filed as an issue on cram2/cognitive_robot_abstract_machine.

  - id: krrood-sara-remaining-sections
    title: Model SARA's remaining sections in krrood and score all 120 test cases
    branch: krrood-sara-remaining-sections
    track: krrood-benchmarks
    depends_on: [krrood-sara]
    status: not started
    notes: >
      Model the rest of SARA's nine Internal Revenue Code sections on krrood-sara's loading
      and scoring, and score the share of the 120 test-split cases answered as SARA's Prolog
      program answers them, entailment and amounts scored apart.
